name: Auto Generate & Archive Weekly Form-3 Progress Report

on:
  schedule:
    # Runs at 18:29 UTC every Thursday (11:59 PM IST) to capture weekly progress
    - cron: '29 18 * * 4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-archive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install reportlab matplotlib

      - name: Generate Form-3 Weekly Progress Report
        run: |
          python generate_report.py weekly

      - name: Move report to weekly_reports folder
        run: |
          mkdir -p weekly_reports
          mv -f *.pdf weekly_reports/

      - name: Commit and push archived report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add weekly_reports/
          if git diff --staged --quiet; then
            echo "No new reports to commit."
          else
            git commit -m "docs: archive Form-3 weekly progress report [skip ci]"
            git push
          fi
